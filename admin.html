<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Portfolio C-Panel</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 0; background-color: #060813; color: #f1f3f9;
      font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
    }
    .admin-page-bg {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at 15% 15%, rgba(124, 92, 255, 0.15) 0%, transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(56, 189, 248, 0.12) 0%, transparent 50%), #060813;
    }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; background: rgba(53, 214, 138, 0.12); color: #35d68a; border: 1px solid rgba(53, 214, 138, 0.3);
    }
    .admin-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #35d68a; box-shadow: 0 0 8px #35d68a; }
  </style>
</head>

<body>
  <div class="admin-page-bg"></div>
  <div id="admin-root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script type="text/plain" id="admin-source">
const getApiBase = () => {
  if (typeof window !== 'undefined') {
    const protocol = window.location.protocol;
    const host = window.location.hostname;
    const port = window.location.port;
    if (protocol === 'file:' || host === '' || host === 'localhost' || host === '127.0.0.1' || host === '::1') {
      if (port === '5000' || port === '3000') return '';
      return 'http://localhost:5000';
    }
    return 'https://mohamedasikportfolio-production.up.railway.app';
  }
  return 'https://mohamedasikportfolio-production.up.railway.app';
};
const API_BASE = getApiBase();

const DEFAULT_DATA = {
  animationSettings: { intensity: "balanced", enableSplash: true, enableParallax: true, enableCursorGlow: true, reducedMotionRespect: true },
  splash: { enabled: true, greeting: "MOHAMED ASIK K", tagline: "FLUTTER DEVELOPER", duration: 2500 },
  hero: { firstName: "Mohamed Asik", lastName: "K", role: "Flutter Developer", availability: "Open to Opportunities", bio: "I craft stunning mobile & web experiences with Flutter, Dart & modern backend integrations.", resumeUrl: "#", avatarUrl: "", socials: { github: "#", linkedin: "#", instagram: "#", twitter: "#" } },
  about: { name: "MOHAMED ASIK K", location: "Chennai, Tamil Nadu, India", email: "mohamedasik.in@gmail.com", phone: "+91 63825 55230", experience: "Fresher / Mobile Specialist", status: "Available for Full-time Roles & Projects", headline: "Architecting Scalable Mobile Applications with Flutter & Clean Architecture", bio: "Passionate Flutter Developer with hands-on expertise building responsive, high-performance cross-platform mobile apps for iOS and Android.", summary: "Building native-performing iOS & Android mobile apps.", philosophy: "Declarative UI, Clean Architecture, and Uncompromising User Experience.", strengths: ["Flutter & Dart Mastery", "Clean Architecture", "REST API & Firebase", "Pixel-Perfect UI/UX"], resumeUrl: "#", avatarUrl: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=600&h=800&q=80" },
  contact: { email: "mohamedasik.in@gmail.com", phone: "+91 63825 55230", location: "Chennai, Tamil Nadu, India", whatsappUrl: "https://wa.me/916382555230" },
  academic: [],
  experience: [],
  skills: { frontend: [], backend: [] },
  certificates: [],
  projects: []
};

const AdminApp = () => {
  const [data, setData] = React.useState(DEFAULT_DATA);
  const [isLoggedIn, setIsLoggedIn] = React.useState(false);
  const [username, setUsername] = React.useState("admin");
  const [password, setPassword] = React.useState("");
  const [loginError, setLoginError] = React.useState("");
  const [activeTab, setActiveTab] = React.useState("overview");
  const [toast, setToast] = React.useState({ show: false, msg: "" });

  const [heroForm, setHeroForm] = React.useState({ ...DEFAULT_DATA.hero });
  const [aboutForm, setAboutForm] = React.useState({ ...DEFAULT_DATA.about });
  const [contactForm, setContactForm] = React.useState({ ...DEFAULT_DATA.contact });
  const [academicList, setAcademicList] = React.useState([]);
  const [experienceList, setExperienceList] = React.useState([]);
  const [skillsList, setSkillsList] = React.useState({ frontend: [], backend: [] });
  const [certsList, setCertsList] = React.useState([]);
  const [projectsList, setProjectsList] = React.useState([]);
  const [leadsList, setLeadsList] = React.useState([]);
  const [animForm, setAnimForm] = React.useState({ ...DEFAULT_DATA.animationSettings });

  const showToast = (msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast({ show: false, msg: "" }), 3200);
  };

  const fetchPortfolioData = async () => {
    try {
      const res = await fetch(`${API_BASE}/api/portfolio-data`);
      if (res.ok) {
        const fetchedData = await res.json();
        setData(fetchedData);
        if (fetchedData.hero) setHeroForm({ ...fetchedData.hero });
        if (fetchedData.about) setAboutForm({ ...fetchedData.about });
        if (fetchedData.contact) setContactForm({ ...fetchedData.contact });
        if (fetchedData.academic) setAcademicList(JSON.parse(JSON.stringify(fetchedData.academic)));
        if (fetchedData.experience) setExperienceList(JSON.parse(JSON.stringify(fetchedData.experience)));
        if (fetchedData.skills) setSkillsList(JSON.parse(JSON.stringify(fetchedData.skills)));
        if (fetchedData.certificates) setCertsList(JSON.parse(JSON.stringify(fetchedData.certificates)));
        if (fetchedData.projects) setProjectsList(JSON.parse(JSON.stringify(fetchedData.projects)));
        if (fetchedData.animationSettings) setAnimForm({ ...fetchedData.animationSettings });
      }
    } catch(err) { console.error("Error loading data:", err); }
  };

  const fetchLeads = async () => {
    try {
      const res = await fetch(`${API_BASE}/api/leads`);
      if (res.ok) { setLeadsList(await res.json()); }
    } catch(err) { console.error("Error fetching leads:", err); }
  };

  React.useEffect(() => {
    fetchPortfolioData();
    let eventSource;
    try {
      eventSource = new EventSource(`${API_BASE}/api/events`);
      eventSource.onmessage = (e) => {
        try {
          const payload = JSON.parse(e.data);
          if (payload.type === 'PORTFOLIO_UPDATED' && payload.data) {
            setData(payload.data);
          }
        } catch(err) {}
      };
    } catch(err) {}
    return () => { if (eventSource) eventSource.close(); };
  }, []);

  React.useEffect(() => {
    if (isLoggedIn) fetchLeads();
  }, [isLoggedIn]);

  const handleLogin = async (e) => {
    e.preventDefault();
    setLoginError("");
    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const contentType = res.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        throw new Error("Backend server error");
      }
      const resData = await res.json();
      if (res.ok && resData.success) {
        setIsLoggedIn(true);
        showToast("Access Granted. Welcome to your Admin C-Panel!");
      } else {
        setLoginError(resData.error || "Invalid Credentials.");
      }
    } catch(err) { setLoginError("Login failed: " + err.message); }
  };

  const saveConfig = async (updatedData) => {
    setData(updatedData);
    try {
      localStorage.setItem("portfolio_data", JSON.stringify(updatedData));
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('portfolio_sync');
        bc.postMessage({ type: 'PORTFOLIO_UPDATED', data: updatedData });
        bc.close();
      }
    } catch(e) {}

    try {
      const res = await fetch(`${API_BASE}/api/portfolio-data`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: updatedData })
      });
      if (res.ok) showToast("✓ Changes persistent & broadcast live!");
    } catch(err) { console.error("Error saving data:", err); }
  };

  const compressImage = (file, maxWidth = 800, maxHeight = 800, quality = 0.8) => {
    return new Promise((resolve) => {
      if (!file || !file.type.startsWith("image/")) { resolve(null); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; } }
          else { if (h > maxHeight) { w = Math.round((w * maxHeight) / h); h = maxHeight; } }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          try {
            const webp = canvas.toDataURL("image/webp", quality);
            if (webp && webp.startsWith("data:image/webp")) { resolve(webp); return; }
          } catch(e) {}
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => resolve(e.target.result);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  };

  if (!isLoggedIn) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", justifyContent: "center", alignItems: "center", padding: "20px" }}>
        <form className="cpanel-login-box" onSubmit={handleLogin} style={{ width: "100%", maxWidth: "380px" }}>
          <div style={{ textAlign: "center", marginBottom: "8px" }}>
            <div className="admin-badge"><span className="admin-badge-dot"></span> SECURE ADMIN PORTAL</div>
          </div>
          <div className="cpanel-login-title">Admin <span>C-Panel</span></div>
          <p style={{ color: "#9aa3b8", fontSize: "13px", textAlign: "center", margin: "-4px 0 14px 0" }}>
            Enter your credentials to manage your live 2026 portfolio.
          </p>
          {loginError && <div className="cpanel-login-error">⚠️ {loginError}</div>}
          <div className="cpanel-input-group">
            <label>Username</label>
            <input required type="text" className="cpanel-input" value={username} onChange={e=>setUsername(e.target.value)} />
          </div>
          <div className="cpanel-input-group">
            <label>Password</label>
            <input required type="password" className="cpanel-input" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" />
          </div>
          <button type="submit" className="cpanel-btn cpanel-btn-primary" style={{ justifyContent: "center", marginTop: "10px", width: "100%" }}>
            Access Dashboard →
          </button>
          <div style={{ display: "flex", justifyContent: "center", marginTop: "12px" }}>
            <a href="/" style={{ color: "#9aa3b8", fontSize: "12.5px" }}>← Back to Live Portfolio</a>
          </div>
        </form>
      </div>
    );
  }

  const totalSkills = (skillsList.frontend || []).length + (skillsList.backend || []).length;

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div className="cpanel-header">
        <div className="cpanel-header-title">
          <span>⚡ Admin</span> C-Panel
          <div className="admin-badge" style={{ marginLeft: "12px" }}>
            <span className="admin-badge-dot"></span> 2026 LIVE CMS
          </div>
        </div>
        <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
          <a href="/" target="_blank" rel="noopener noreferrer" className="cpanel-btn cpanel-btn-outline">🌐 Live Portfolio ↗</a>
          <button className="cpanel-close-btn" onClick={() => setIsLoggedIn(false)}>🚪 Logout</button>
        </div>
      </div>
      
      <div className="cpanel-body">
        <div className="cpanel-sidebar">
          <button className={`cpanel-sidebar-item ${activeTab==="overview"?"active":""}`} onClick={()=>setActiveTab("overview")}>📊 Overview</button>
          <button className={`cpanel-sidebar-item ${activeTab==="hero"?"active":""}`} onClick={()=>setActiveTab("hero")}>👤 Hero & About</button>
          <button className={`cpanel-sidebar-item ${activeTab==="academic"?"active":""}`} onClick={()=>setActiveTab("academic")}>🎓 Academic</button>
          <button className={`cpanel-sidebar-item ${activeTab==="experience"?"active":""}`} onClick={()=>setActiveTab("experience")}>💼 Experience</button>
          <button className={`cpanel-sidebar-item ${activeTab==="skills"?"active":""}`} onClick={()=>setActiveTab("skills")}>⚡ Skills ({totalSkills})</button>
          <button className={`cpanel-sidebar-item ${activeTab==="projects"?"active":""}`} onClick={()=>setActiveTab("projects")}>📂 Projects ({projectsList.length})</button>
          <button className={`cpanel-sidebar-item ${activeTab==="certs"?"active":""}`} onClick={()=>setActiveTab("certs")}>🥇 Certificates ({certsList.length})</button>
          <button className={`cpanel-sidebar-item ${activeTab==="motion"?"active":""}`} onClick={()=>setActiveTab("motion")}>✨ Motion FX</button>
          <button className={`cpanel-sidebar-item ${activeTab==="leads"?"active":""}`} onClick={()=>setActiveTab("leads")}>📥 Leads ({leadsList.length})</button>
        </div>
        
        <div className="cpanel-content">
          {/* OVERVIEW */}
          {activeTab === "overview" && (
            <div>
              <div className="cpanel-card">
                <div className="cpanel-card-title">
                  <div>System Dashboard</div>
                  <span style={{ fontSize: "12px", color: "#35d68a" }}>● SQLite Database Connected</span>
                </div>
                <p style={{ color: "#9aa3b8", lineHeight: "1.6", margin: "0 0 20px 0", fontSize: "14px" }}>
                  Manage your portfolio data in real time. Changes saved here are persisted to SQLite & JSON and broadcast live to visitors.
                </p>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: "16px" }}>
                  <div style={{ background: "rgba(124, 92, 255, 0.1)", padding: "20px", borderRadius: "14px", border: "1px solid rgba(124, 92, 255, 0.2)" }}>
                    <div style={{ fontSize: "12px", color: "#9aa3b8" }}>TOTAL SKILLS</div>
                    <div style={{ fontSize: "32px", fontWeight: "800", color: "#7c5cff" }}>{totalSkills}</div>
                  </div>
                  <div style={{ background: "rgba(56, 189, 248, 0.1)", padding: "20px", borderRadius: "14px", border: "1px solid rgba(56, 189, 248, 0.2)" }}>
                    <div style={{ fontSize: "12px", color: "#9aa3b8" }}>PROJECTS</div>
                    <div style={{ fontSize: "32px", fontWeight: "800", color: "#38bdf8" }}>{projectsList.length}</div>
                  </div>
                  <div style={{ background: "rgba(53, 214, 138, 0.1)", padding: "20px", borderRadius: "14px", border: "1px solid rgba(53, 214, 138, 0.2)" }}>
                    <div style={{ fontSize: "12px", color: "#9aa3b8" }}>LEADS INBOX</div>
                    <div style={{ fontSize: "32px", fontWeight: "800", color: "#35d68a" }}>{leadsList.length}</div>
                  </div>
                  <div style={{ background: "rgba(234, 179, 8, 0.1)", padding: "20px", borderRadius: "14px", border: "1px solid rgba(234, 179, 8, 0.2)" }}>
                    <div style={{ fontSize: "12px", color: "#9aa3b8" }}>CERTIFICATES</div>
                    <div style={{ fontSize: "32px", fontWeight: "800", color: "#eab308" }}>{certsList.length}</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* HERO & ABOUT */}
          {activeTab === "hero" && (
            <form onSubmit={(e) => { e.preventDefault(); saveConfig({ ...data, hero: heroForm, about: aboutForm, contact: contactForm }); }}>
              <div className="cpanel-card">
                <div className="cpanel-card-title">Hero Section Config</div>
                <div className="cpanel-form-grid">
                  <div className="cpanel-input-group"><label>First Name</label><input className="cpanel-input" value={heroForm.firstName} onChange={e=>setHeroForm({...heroForm, firstName:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Last Name</label><input className="cpanel-input" value={heroForm.lastName} onChange={e=>setHeroForm({...heroForm, lastName:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>Role Subhead</label><input className="cpanel-input" value={heroForm.role} onChange={e=>setHeroForm({...heroForm, role:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>Availability Badge</label><input className="cpanel-input" value={heroForm.availability || "Open to Opportunities"} onChange={e=>setHeroForm({...heroForm, availability:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>Bio Narrative</label><textarea className="cpanel-input cpanel-textarea" value={heroForm.bio} onChange={e=>setHeroForm({...heroForm, bio:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full">
                    <label>Profile Avatar Upload (WebP Canvas Compression)</label>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                      <img src={heroForm.avatarUrl || "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=100&h=100"} alt="Preview" style={{ width: '48px', height: '48px', borderRadius: '10px', objectFit: 'cover' }} />
                      <input type="file" accept="image/*" className="cpanel-input" onChange={async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const compressed = await compressImage(file, 800, 800, 0.8);
                          if (compressed) { setHeroForm(prev => ({ ...prev, avatarUrl: compressed })); showToast("Avatar compressed!"); }
                        }
                      }} style={{ flex: 1 }} />
                    </div>
                  </div>
                  <div className="cpanel-input-group cpanel-form-full">
                    <label>Resume File Upload (PDF / Document)</label>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                      <input type="file" accept=".pdf,.doc,.docx" className="cpanel-input" onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = (evt) => {
                            const resBase64 = evt.target.result;
                            setHeroForm(prev => ({ ...prev, resumeUrl: resBase64 }));
                            setAboutForm(prev => ({ ...prev, resumeUrl: resBase64 }));
                            showToast("Resume uploaded successfully!");
                          };
                          reader.readAsDataURL(file);
                        }
                      }} style={{ flex: 1 }} />
                      {(heroForm.resumeUrl || aboutForm.resumeUrl) && (
                        <a href={heroForm.resumeUrl || aboutForm.resumeUrl} target="_blank" rel="noopener noreferrer" className="cpanel-btn cpanel-btn-outline" style={{ padding: '6px 12px', fontSize: '12px' }}>
                          📄 View Current Resume
                        </a>
                      )}
                    </div>
                  </div>
                </div>
              </div>

              <div className="cpanel-card">
                <div className="cpanel-card-title">About Me Details</div>
                <div className="cpanel-form-grid">
                  <div className="cpanel-input-group"><label>Display Name</label><input className="cpanel-input" value={aboutForm.name || ""} onChange={e=>setAboutForm({...aboutForm, name:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Experience Text</label><input className="cpanel-input" value={aboutForm.experience || ""} onChange={e=>setAboutForm({...aboutForm, experience:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Email Address</label><input className="cpanel-input" value={aboutForm.email || ""} onChange={e=>setAboutForm({...aboutForm, email:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Phone Number</label><input className="cpanel-input" value={aboutForm.phone || ""} onChange={e=>setAboutForm({...aboutForm, phone:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Location</label><input className="cpanel-input" value={aboutForm.location || ""} onChange={e=>{ const val = e.target.value; setAboutForm({...aboutForm, location:val}); setContactForm({...contactForm, location:val}); }}/></div>
                  <div className="cpanel-input-group"><label>Status Badge</label><input className="cpanel-input" value={aboutForm.status || ""} onChange={e=>setAboutForm({...aboutForm, status:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>Headline</label><input className="cpanel-input" value={aboutForm.headline || ""} onChange={e=>setAboutForm({...aboutForm, headline:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>Summary Subtitle</label><input className="cpanel-input" value={aboutForm.summary || ""} onChange={e=>setAboutForm({...aboutForm, summary:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>About Bio Description</label><textarea className="cpanel-input cpanel-textarea" value={aboutForm.bio || ""} onChange={e=>setAboutForm({...aboutForm, bio:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full"><label>Development Philosophy</label><input className="cpanel-input" value={aboutForm.philosophy || ""} onChange={e=>setAboutForm({...aboutForm, philosophy:e.target.value})}/></div>
                  <div className="cpanel-input-group cpanel-form-full">
                    <label>Core Strengths (comma separated)</label>
                    <input
                      className="cpanel-input"
                      value={Array.isArray(aboutForm.strengths) ? aboutForm.strengths.join(", ") : (aboutForm.strengths || "")}
                      onChange={e=>setAboutForm({...aboutForm, strengths: e.target.value.split(",").map(s => s.trim()).filter(Boolean)})}
                    />
                  </div>
                </div>
              </div>

              <div className="cpanel-card">
                <div className="cpanel-card-title">Social Profiles & Contact Info</div>
                <div className="cpanel-form-grid">
                  <div className="cpanel-input-group"><label>GitHub URL</label><input className="cpanel-input" value={(heroForm.socials && heroForm.socials.github) || ""} onChange={e=>setHeroForm({...heroForm, socials:{...(heroForm.socials || {}), github:e.target.value}})}/></div>
                  <div className="cpanel-input-group"><label>LinkedIn URL</label><input className="cpanel-input" value={(heroForm.socials && heroForm.socials.linkedin) || ""} onChange={e=>setHeroForm({...heroForm, socials:{...(heroForm.socials || {}), linkedin:e.target.value}})}/></div>
                  <div className="cpanel-input-group"><label>Instagram URL</label><input className="cpanel-input" value={(heroForm.socials && heroForm.socials.instagram) || ""} onChange={e=>setHeroForm({...heroForm, socials:{...(heroForm.socials || {}), instagram:e.target.value}})}/></div>
                  <div className="cpanel-input-group"><label>Twitter URL</label><input className="cpanel-input" value={(heroForm.socials && heroForm.socials.twitter) || ""} onChange={e=>setHeroForm({...heroForm, socials:{...(heroForm.socials || {}), twitter:e.target.value}})}/></div>
                  <div className="cpanel-input-group"><label>WhatsApp URL</label><input className="cpanel-input" value={contactForm.whatsappUrl || ""} onChange={e=>setContactForm({...contactForm, whatsappUrl:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Contact Email</label><input className="cpanel-input" value={contactForm.email || ""} onChange={e=>setContactForm({...contactForm, email:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Contact Phone</label><input className="cpanel-input" value={contactForm.phone || ""} onChange={e=>setContactForm({...contactForm, phone:e.target.value})}/></div>
                  <div className="cpanel-input-group"><label>Contact Location</label><input className="cpanel-input" value={contactForm.location || aboutForm.location || ""} onChange={e=>{ const val = e.target.value; setContactForm({...contactForm, location:val}); setAboutForm({...aboutForm, location:val}); }}/></div>
                </div>
              </div>

              <button type="submit" className="cpanel-btn cpanel-btn-primary">Save Hero, About & Social Settings</button>
            </form>
          )}

          {/* ACADEMIC */}
          {activeTab === "academic" && (
            <form onSubmit={(e) => { e.preventDefault(); saveConfig({ ...data, academic: academicList }); }}>
              <div className="cpanel-card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                  <div className="cpanel-card-title" style={{ marginBottom: 0 }}>Academic Background CMS</div>
                  <button type="button" className="cpanel-btn cpanel-btn-outline" onClick={() => setAcademicList([...academicList, { id: `edu_${Date.now()}`, qualification: "Qualification", institution: "Institution", location: "Location", startDate: "2022", endDate: "2026", cgpa: "8.5 / 10", description: "", published: true }])}>+ Add Academic Record</button>
                </div>
                {academicList.map((item, idx) => (
                  <div key={idx} style={{ border: "1px solid rgba(255,255,255,0.08)", padding: "16px", borderRadius: "12px", background: "rgba(255,255,255,0.02)", marginBottom: "14px" }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px", marginBottom: "10px" }}>
                      <input className="cpanel-input" value={item.qualification || ""} onChange={e => { const next = [...academicList]; next[idx].qualification = e.target.value; setAcademicList(next); }} placeholder="Qualification"/>
                      <input className="cpanel-input" value={item.institution || ""} onChange={e => { const next = [...academicList]; next[idx].institution = e.target.value; setAcademicList(next); }} placeholder="Institution"/>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "10px", marginBottom: "10px" }}>
                      <input className="cpanel-input" value={item.startDate || ""} onChange={e => { const next = [...academicList]; next[idx].startDate = e.target.value; setAcademicList(next); }} placeholder="Start Date"/>
                      <input className="cpanel-input" value={item.endDate || ""} onChange={e => { const next = [...academicList]; next[idx].endDate = e.target.value; setAcademicList(next); }} placeholder="End Date"/>
                      <input className="cpanel-input" value={item.cgpa || ""} onChange={e => { const next = [...academicList]; next[idx].cgpa = e.target.value; setAcademicList(next); }} placeholder="CGPA / Score"/>
                    </div>
                    <button type="button" className="cpanel-btn cpanel-btn-danger" style={{ fontSize: "11px", padding: "4px 8px" }} onClick={() => { const next = [...academicList]; next.splice(idx, 1); setAcademicList(next); }}>Remove</button>
                  </div>
                ))}
              </div>
              <button type="submit" className="cpanel-btn cpanel-btn-primary">Save Academic History</button>
            </form>
          )}

          {/* EXPERIENCE */}
          {activeTab === "experience" && (
            <form onSubmit={(e) => { e.preventDefault(); saveConfig({ ...data, experience: experienceList }); }}>
              <div className="cpanel-card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                  <div className="cpanel-card-title" style={{ marginBottom: 0 }}>Work Experience CMS</div>
                  <button type="button" className="cpanel-btn cpanel-btn-outline" onClick={() => setExperienceList([...experienceList, { id: `exp_${Date.now()}`, jobTitle: "Job Title", company: "Company", location: "Location", startDate: "2025", endDate: "2026", responsibilities: [], techStack: ["Flutter", "Dart"], published: true }])}>+ Add Experience Record</button>
                </div>
                {experienceList.map((item, idx) => (
                  <div key={idx} style={{ border: "1px solid rgba(255,255,255,0.08)", padding: "16px", borderRadius: "12px", background: "rgba(255,255,255,0.02)", marginBottom: "14px" }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px", marginBottom: "10px" }}>
                      <input className="cpanel-input" value={item.jobTitle || ""} onChange={e => { const next = [...experienceList]; next[idx].jobTitle = e.target.value; setExperienceList(next); }} placeholder="Job Title"/>
                      <input className="cpanel-input" value={item.company || ""} onChange={e => { const next = [...experienceList]; next[idx].company = e.target.value; setExperienceList(next); }} placeholder="Company Name"/>
                    </div>
                    <button type="button" className="cpanel-btn cpanel-btn-danger" style={{ fontSize: "11px", padding: "4px 8px" }} onClick={() => { const next = [...experienceList]; next.splice(idx, 1); setExperienceList(next); }}>Remove</button>
                  </div>
                ))}
              </div>
              <button type="submit" className="cpanel-btn cpanel-btn-primary">Save Work Experience</button>
            </form>
          )}

          {/* SKILLS */}
          {activeTab === "skills" && (
            <div className="cpanel-card">
              <div className="cpanel-card-title">Skills Stack CMS</div>
              {["frontend", "backend"].map((cat) => (
                <div key={cat} style={{ marginBottom: "20px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "10px" }}>
                    <h4 style={{ textTransform: "capitalize", color: "#7c5cff" }}>{cat} Skills</h4>
                    <button className="cpanel-btn cpanel-btn-outline" style={{ fontSize: "12px", padding: "4px 8px" }} onClick={() => {
                      const next = { ...skillsList }; if (!next[cat]) next[cat] = [];
                      next[cat].push({ name: "New Skill", sub: "Tech", pct: 85, glyph: "⚡" }); setSkillsList(next);
                    }}>+ Add Skill</button>
                  </div>
                  {(skillsList[cat] || []).map((sk, idx) => (
                    <div key={idx} style={{ display: "flex", gap: "8px", marginBottom: "8px", alignItems: "center" }}>
                      <input className="cpanel-input" style={{ width: "160px" }} value={sk.name} onChange={e => { const next = { ...skillsList }; next[cat][idx].name = e.target.value; setSkillsList(next); }} />
                      <input className="cpanel-input" style={{ width: "120px" }} value={sk.sub} onChange={e => { const next = { ...skillsList }; next[cat][idx].sub = e.target.value; setSkillsList(next); }} />
                      <input type="number" className="cpanel-input" style={{ width: "70px" }} value={sk.pct} onChange={e => { const next = { ...skillsList }; next[cat][idx].pct = parseInt(e.target.value) || 0; setSkillsList(next); }} />
                      <button className="cpanel-btn cpanel-btn-danger" style={{ padding: "4px 8px" }} onClick={() => { const next = { ...skillsList }; next[cat].splice(idx, 1); setSkillsList(next); }}>✕</button>
                    </div>
                  ))}
                </div>
              ))}
              <button className="cpanel-btn cpanel-btn-primary" onClick={() => saveConfig({ ...data, skills: skillsList })}>Save Skills</button>
            </div>
          )}

          {/* PROJECTS */}
          {activeTab === "projects" && (
            <div className="cpanel-card">
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "16px" }}>
                <div className="cpanel-card-title" style={{ marginBottom: 0 }}>Projects Showcase CMS</div>
                <button className="cpanel-btn cpanel-btn-outline" onClick={() => setProjectsList([...projectsList, { num: `0${projectsList.length + 1}`, title: "New Project", category: "Mobile App", tech: "Flutter, Dart", desc: "", imageUrl: "" }])}>+ Add Project</button>
              </div>
              {projectsList.map((p, idx) => (
                <div key={idx} style={{ border: "1px solid rgba(255,255,255,0.08)", padding: "16px", borderRadius: "12px", background: "rgba(255,255,255,0.02)", marginBottom: "14px" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "60px 1fr 140px", gap: "10px", marginBottom: "10px" }}>
                    <input className="cpanel-input" value={p.num} onChange={e => { const next = [...projectsList]; next[idx].num = e.target.value; setProjectsList(next); }} placeholder="Num"/>
                    <input className="cpanel-input" value={p.title} onChange={e => { const next = [...projectsList]; next[idx].title = e.target.value; setProjectsList(next); }} placeholder="Title"/>
                    <input className="cpanel-input" value={p.category} onChange={e => { const next = [...projectsList]; next[idx].category = e.target.value; setProjectsList(next); }} placeholder="Category"/>
                  </div>
                  <div className="cpanel-input-group" style={{ marginBottom: "10px" }}>
                    <input className="cpanel-input" value={p.tech} onChange={e => { const next = [...projectsList]; next[idx].tech = e.target.value; setProjectsList(next); }} placeholder="Technologies (comma separated)"/>
                  </div>
                  <button className="cpanel-btn cpanel-btn-danger" style={{ fontSize: "11px", padding: "4px 8px" }} onClick={() => { const next = [...projectsList]; next.splice(idx, 1); setProjectsList(next); }}>Delete Project</button>
                </div>
              ))}
              <button className="cpanel-btn cpanel-btn-primary" onClick={() => saveConfig({ ...data, projects: projectsList })}>Save Projects</button>
            </div>
          )}

          {/* CERTIFICATES */}
          {activeTab === "certs" && (
            <div className="cpanel-card">
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "16px" }}>
                <div className="cpanel-card-title" style={{ marginBottom: 0 }}>Certifications CMS</div>
                <button className="cpanel-btn cpanel-btn-outline" onClick={() => setCertsList([...certsList, { issuer: "Issuer", title: "Certificate Title", date: "2026", id: "REF-001", desc: "" }])}>+ Add Certificate</button>
              </div>
              {certsList.map((c, idx) => (
                <div key={idx} style={{ border: "1px solid rgba(255,255,255,0.08)", padding: "16px", borderRadius: "12px", background: "rgba(255,255,255,0.02)", marginBottom: "12px" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px", marginBottom: "10px" }}>
                    <input className="cpanel-input" value={c.issuer} onChange={e => { const next = [...certsList]; next[idx].issuer = e.target.value; setCertsList(next); }} placeholder="Issuer"/>
                    <input className="cpanel-input" value={c.title} onChange={e => { const next = [...certsList]; next[idx].title = e.target.value; setCertsList(next); }} placeholder="Title"/>
                  </div>
                  <button className="cpanel-btn cpanel-btn-danger" style={{ fontSize: "11px", padding: "4px 8px" }} onClick={() => { const next = [...certsList]; next.splice(idx, 1); setCertsList(next); }}>Remove</button>
                </div>
              ))}
              <button className="cpanel-btn cpanel-btn-primary" onClick={() => saveConfig({ ...data, certificates: certsList })}>Save Certificates</button>
            </div>
          )}

          {/* MOTION FX */}
          {activeTab === "motion" && (
            <form onSubmit={(e) => { e.preventDefault(); saveConfig({ ...data, animationSettings: animForm }); }}>
              <div className="cpanel-card">
                <div className="cpanel-card-title">Motion Engine & FX Settings</div>
                <div className="cpanel-input-group" style={{ marginBottom: "16px" }}>
                  <label>Animation Intensity Preset</label>
                  <select className="cpanel-input" value={animForm.intensity || "balanced"} onChange={e => setAnimForm({ ...animForm, intensity: e.target.value })}>
                    <option value="minimal">Minimal (Fades only, no parallax)</option>
                    <option value="balanced">Balanced (Default smooth reveals)</option>
                    <option value="premium">Premium (Full 3D tilt & cursor glow)</option>
                  </select>
                </div>
              </div>
              <button type="submit" className="cpanel-btn cpanel-btn-primary">Save Motion Settings</button>
            </form>
          )}

          {/* LEADS */}
          {activeTab === "leads" && (
            <div className="cpanel-card">
              <div className="cpanel-card-title">
                <div>Client Messages & Leads ({leadsList.length})</div>
                {leadsList.length > 0 && (
                  <button className="cpanel-btn cpanel-btn-danger" style={{ padding: "4px 8px", fontSize: "11px" }} onClick={async () => {
                    if (confirm("Clear all lead messages?")) {
                      await fetch(`${API_BASE}/api/leads`, { method: "DELETE" });
                      setLeadsList([]); showToast("Inbox cleared.");
                    }
                  }}>Clear Inbox</button>
                )}
              </div>
              {leadsList.length === 0 ? (
                <div style={{ textAlign: "center", padding: "30px", color: "#9aa3b8" }}>Inbox empty. No leads received yet.</div>
              ) : (
                leadsList.map((lead) => (
                  <div key={lead.id} style={{ border: "1px solid rgba(255,255,255,0.08)", padding: "14px", borderRadius: "10px", marginBottom: "12px", background: "rgba(255,255,255,0.02)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", color: "#9aa3b8", fontSize: "12px" }}>
                      <strong style={{ color: "#fff" }}>{lead.name}</strong> ({lead.email}) <span>{lead.date}</span>
                    </div>
                    <div style={{ fontSize: "13.5px", margin: "8px 0" }}>{lead.message}</div>
                    <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                      <a href={`mailto:${lead.email}?subject=${encodeURIComponent("Re: " + (lead.subject || "Portfolio Inquiry"))}&body=${encodeURIComponent("Hi " + lead.name + ",\n\nThanks for reaching out!\n\n")}`} className="cpanel-btn cpanel-btn-outline" style={{ fontSize: "11px", padding: "4px 10px", textDecoration: "none" }}>✉️ Reply Email</a>
                      <button className="cpanel-btn cpanel-btn-danger" style={{ fontSize: "11px", padding: "4px 8px" }} onClick={async () => {
                        await fetch(`${API_BASE}/api/leads/${lead.id}`, { method: "DELETE" });
                        setLeadsList(leadsList.filter(l => l.id !== lead.id));
                      }}>Delete Lead</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      </div>

      <div className={`toast ${toast.show ? "show" : ""}`} style={{ position: "fixed", bottom: "24px", right: "24px", zIndex: 10000 }}>
        ⚡ {toast.msg}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("admin-root")).render(<AdminApp />);
  </script>
  <script>
    try {
      var source = document.getElementById("admin-source").textContent;
      var compiled;
      try {
        compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
      } catch (e1) {
        console.warn("Babel transform with classic runtime failed, trying default react preset:", e1);
        compiled = Babel.transform(source, { presets: ["react"] }).code;
      }
      var runnable = document.createElement("script");
      runnable.textContent = compiled;
      document.body.appendChild(runnable);
    } catch (err) {
      console.error("Critical error compiling Admin application:", err);
      if (document.getElementById("admin-root")) {
        document.getElementById("admin-root").innerHTML = "<div style='color:#ef4444;padding:40px;text-align:center;font-family:sans-serif;'><h2>Admin Application Error</h2><p style='color:#9aa3b8;'>" + err.message + "</p></div>";
      }
    }
  </script>
</body>
</html>
