  if (typeof window !== 'undefined') {
    const protocol = window.location.protocol;
    const host = window.location.hostname;
    const port = window.location.port;
    if (protocol === 'file:' || host === '' || host === 'localhost' || host === '127.0.0.1' || host === '::1') {
      if (port === '5000' || port === '3000') {
        return '';
      }
      return 'http://localhost:5000';
    }
    return 'https://mohamedasikportfolio-production.up.railway.app';
  }
  return 'https://mohamedasikportfolio-production.up.railway.app';
};

      text = text.replace(/\r\n/g, "\n");

                    <div
                      key={opt.id}
                      onClick={() => setAnimForm({ ...animForm, intensity: opt.id })}
                      style={{
                        padding: "14px",
                        borderRadius: "10px",
                        background: animForm.intensity === opt.id ? "rgba(124, 92, 255, 0.15)" : "#121728",
                        border: `1.5px solid ${animForm.intensity === opt.id ? "var(--accent-1)" : "rgba(255, 255, 255, 0.08)"}`,
                        cursor: "pointer",
                        transition: "all 0.2s ease"
                      }}
                    >
                      <div style={{ fontWeight: "700", marginBottom: "4px", color: animForm.intensity === opt.id ? "var(--accent-1)" : "#fff" }}>{opt.title}</div>
                      <div style={{ fontSize: "12px", color: "#9aa3b8", lineHeight: "1.4" }}>{opt.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: "14px", marginBottom: "24px" }}>
                <label style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", fontSize: "14px" }}>
                  <input
                    type="checkbox"
                    checked={animForm.enableSplash}
                    onChange={e => setAnimForm({ ...animForm, enableSplash: e.target.checked })}
                  />
                  <span>Enable Intro Splash Loading Animation</span>
                </label>

                <label style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", fontSize: "14px" }}>
                  <input
                    type="checkbox"
                    checked={animForm.enableCursorGlow}
                    onChange={e => setAnimForm({ ...animForm, enableCursorGlow: e.target.checked })}
                  />
                  <span>Enable Interactive Custom Glow Cursor</span>
                </label>

                <label style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", fontSize: "14px" }}>
                  <input
                    type="checkbox"
                    checked={animForm.enableParallax}
                    onChange={e => setAnimForm({ ...animForm, enableParallax: e.target.checked })}
                  />
                  <span>Enable Parallax & Ambient Floating Elements</span>
                </label>

                <label style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", fontSize: "14px" }}>
                  <input
                    type="checkbox"
                    checked={animForm.reducedMotionRespect}
                    onChange={e => setAnimForm({ ...animForm, reducedMotionRespect: e.target.checked })}
                  />
                  <span>Automatically Respect OS "Prefers Reduced Motion" Settings</span>
                </label>
              </div>

              <button type="submit" className="cpanel-btn cpanel-btn-primary">Save Motion Settings</button>
            </form>
          )}

          {activeTab === "sync" && (
            <div className="cpanel-card">
              <div className="cpanel-card-title">Backup & Restore</div>
              <p style={{ color: "#9aa3b8", lineHeight: "1.6", marginBottom: "15px", fontSize: "14px" }}>
                Download your configurations as a JSON file, or restore default values.
              </p>
              <div style={{ display: "flex", gap: "10px" }}>
                <button className="cpanel-btn cpanel-btn-outline" onClick={()=>{
                  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                  const a = document.createElement("a");
                  a.href = URL.createObjectURL(blob);
                  a.download = "portfolio_backup.json";
                  a.click();
                }}>Download JSON configuration backup</button>
                
                <button className="cpanel-btn cpanel-btn-danger" onClick={async ()=>{
                  if (confirm("Reset to hardcoded defaults? This will erase all your inputs!")) {
                    await saveConfig(DEFAULT_PORTFOLIO_DATA);
                    window.location.reload();
                  }
                }}>Reset to hardcoded defaults</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

/* ---------------- Reveal-on-scroll hook ---------------- */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); } });
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}
const Reveal = ({ children, className = "", style }) => {
  const ref = useReveal();
  return <div ref={ref} className={`reveal ${className}`} style={style}>{children}</div>;
};

/* ---------------- Starfield ---------------- */
const Starfield = () => {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animationFrameId;
    let particles = [];
    const numParticles = Math.min(window.innerWidth / 15, 60);

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    window.addEventListener("resize", resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 1.5 + 0.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
        if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
      }
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(124, 92, 255, 0.4)";
        ctx.fill();
      }
    }

    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw(ctx);
        for (let j = i; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(124, 92, 255, ${0.15 - dist / 800})`;
            ctx.lineWidth = 0.6;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      animationFrameId = window.requestAnimationFrame(render);
    };
    render();

    return () => {
      window.removeEventListener("resize", resize);
      window.cancelAnimationFrame(animationFrameId);
    };
  }, []);

  return <canvas ref={canvasRef} className="starfield" style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", zIndex: 0, pointerEvents: "none" }} />;
};

const SplashScreen = () => {
  const { data } = useContext(PortfolioContext);
  const splashConfig = (data && data.splash) || {};
  const animConfig = (data && data.animationSettings) || {};
  const [visible, setVisible] = useState(true);
  const [fadingOut, setFadingOut] = useState(false);

  useEffect(() => {
    if (splashConfig.enabled === false || animConfig.enableSplash === false) {
      setVisible(false);
      return;
    }

    const hasSeenSplash = sessionStorage.getItem("portfolio_splash_shown");
    const duration = hasSeenSplash ? 800 : (splashConfig.duration || 2500);

    const timer = setTimeout(() => {
      handleComplete();
    }, duration);

    return () => clearTimeout(timer);
  }, [splashConfig.enabled, animConfig.enableSplash, splashConfig.duration]);

  const handleComplete = () => {
    sessionStorage.setItem("portfolio_splash_shown", "true");
    setFadingOut(true);
    setTimeout(() => {
      setVisible(false);
    }, 500);
  };

  if (!visible) return null;

  const greeting = splashConfig.greeting || "MOHAMED ASIK K";
  const tagline = splashConfig.tagline || "FLUTTER DEVELOPER";

  return (
    <div className={`splash-screen ${fadingOut ? "fade-out" : ""}`}>
      <button className="splash-skip-btn" onClick={handleComplete} aria-label="Skip splash screen">
        Skip <Icon name="arrow" size={14} />
      </button>

      <div className="splash-content">

          <div className="splash-glow-backdrop" />

          <h1 className="splash-greeting">{greeting}</h1>

/* ---------------- Interactive Ambient Glow Cursor ---------------- */
const CustomCursor = () => {
  const { data } = useContext(PortfolioContext);
  const anim = (data && data.animationSettings) || {
    intensity: "balanced",
    enableSplash: true,
    enableParallax: true,
    enableCursorGlow: true,
    reducedMotionRespect: true
  };

  const [pos, setPos] = useState({ x: -100, y: -100 });
  const [isHovered, setIsHovered] = useState(false);
  const [isTouchDevice, setIsTouchDevice] = useState(false);
  const [reducedMotion, setReducedMotion] = useState(false);

  useEffect(() => {
    setIsTouchDevice(window.matchMedia('(pointer: coarse)').matches);
    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducedMotion(mediaQuery.matches);
    const listener = (e) => setReducedMotion(e.matches);
    if (mediaQuery.addEventListener) {
      mediaQuery.addEventListener('change', listener);
      return () => mediaQuery.removeEventListener('change', listener);
    }
  }, []);

  useEffect(() => {
    const onMouseMove = (e) => {
      setPos({ x: e.clientX, y: e.clientY });
      const target = e.target;
      const isInteractive = target && target.closest && target.closest('a, button, input, textarea, select, .project-card, .skill-card, .cert-card, .project-filter-pill, .cpanel-sidebar-item, .nav-link, .btn, .story-card, .academic-card, .timeline-card');
      setIsHovered(!!isInteractive);
    };
    window.addEventListener('mousemove', onMouseMove);
    return () => window.removeEventListener('mousemove', onMouseMove);
  }, []);

  useEffect(() => {
    if (isHovered) {
      document.body.classList.add('custom-cursor-hover');
    } else {
      document.body.classList.remove('custom-cursor-hover');
    }
  }, [isHovered]);

  if (isTouchDevice || anim.enableCursorGlow === false || (anim.reducedMotionRespect && reducedMotion)) {
    return null;
  }

  return (
    <>
      <div className="custom-cursor-dot" style={{ left: `${pos.x}px`, top: `${pos.y}px` }} />
      <div className="custom-cursor-ring" style={{ left: `${pos.x}px`, top: `${pos.y}px` }} />
    </>
  );
};

const Projects = () => {
  const { data } = useContext(PortfolioContext);
  const projectsList = data.projects || [];
  const [activeCategory, setActiveCategory] = useState("All");
  const [selectedProjectModal, setSelectedProjectModal] = useState(null);

  const categories = ["All", ...Array.from(new Set(projectsList.map(p => p.category).filter(Boolean)))];
  
  const filteredProjects = activeCategory === "All" 
    ? projectsList 
    : projectsList.filter(p => p.category === activeCategory);

  const [activeIdx, setActiveIdx] = useState(0);
  const [containerWidth, setContainerWidth] = useState(1180);
  const [dragStart, setDragStart] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const [isHovered, setIsHovered] = useState(false);
  const [isDragging, setIsDragging] = useState(false);
  const wrapperRef = useRef(null);
  
  const isDraggingRef = useRef(isDragging);
  const isHoveredRef = useRef(isHovered);

  useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
  useEffect(() => { isHoveredRef.current = isHovered; }, [isHovered]);
  useEffect(() => { setActiveIdx(0); }, [activeCategory]);

  const total = filteredProjects.length;
  const gap = 24;

  const getCardWidth = () => {
    return window.innerWidth < 640 ? window.innerWidth * 0.82 : 370;
  };

  useEffect(() => {
    if (!wrapperRef.current) return;
    const handleResize = () => setContainerWidth(wrapperRef.current.offsetWidth);
    handleResize();
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);

  useEffect(() => {
    const interval = setInterval(() => {
      if (isDraggingRef.current || isHoveredRef.current || total <= 1) return;
      setActiveIdx((prev) => (prev + 1) % total);
    }, 3500);
    return () => clearInterval(interval);
  }, [total]);

  const handleNext = () => { if (total > 0) setActiveIdx((prev) => (prev + 1) % total); };
  const handlePrev = () => { if (total > 0) setActiveIdx((prev) => (prev - 1 + total) % total); };

  const handleTouchStart = (e) => { setDragStart(e.touches[0].clientX); setIsDragging(true); };
  const handleTouchMove = (e) => { if (dragStart === null) return; setDragOffset(e.touches[0].clientX - dragStart); };
  const handleMouseDown = (e) => { setDragStart(e.clientX); setIsDragging(true); };
  const handleMouseMove = (e) => { if (!isDragging || dragStart === null) return; setDragOffset(e.clientX - dragStart); };

  const handleDragEnd = () => {
    if (!isDragging) return;
    const threshold = getCardWidth() / 3;
    if (dragOffset < -threshold && total > 0) {
      setActiveIdx((prev) => (prev + 1) % total);
    } else if (dragOffset > threshold && total > 0) {
      setActiveIdx((prev) => (prev - 1 + total) % total);
    }
    setDragStart(null);
    setDragOffset(0);
    setIsDragging(false);
  };

  const cardW = getCardWidth();
  const trackOffset = total > 0 ? (containerWidth / 2 - cardW / 2 - activeIdx * (cardW + gap) + dragOffset) : 0;

  return (
    <section id="projects" className="projects-section-container">
      <div className="projects-bg-glow" />
      <div className="container">
        <div className="projects-header-centered">
          <Reveal className="section-tag" style={{ marginBottom: 0 }}>
            <div className="eyebrow" style={{ textAlign: "center" }}>Featured Works</div>
          </Reveal>
          <h2>I make Incredible <span className="grad-text">Projects</span></h2>
        </div>

        {/* Category Filter Pills */}
        <div className="project-filter-pills">
          {categories.map((cat) => (
            <button
              key={cat}
              className={`project-filter-pill ${activeCategory === cat ? "active" : ""}`}
              onClick={() => setActiveCategory(cat)}
            >
              {cat}
            </button>
          ))}
        </div>

        <div 
          className="projects-slider-wrapper" 
          ref={wrapperRef}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleDragEnd}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleDragEnd}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => {
            handleDragEnd();
            setIsHovered(false);
          }}
        >
          <div 
            className={`projects-slider-track ${isDragging ? "dragging" : ""}`}
            style={{ transform: `translateX(${trackOffset}px)` }}
          >
            {filteredProjects.map((p, i) => (
              <ProjectCard 
                key={i} 
                p={p} 
                i={i} 
                activeIdx={activeIdx}
                cardW={cardW}
                onClick={() => setActiveIdx(i)}
                onOpenModal={setSelectedProjectModal}
              />
            ))}
          </div>
        </div>

        {total > 1 && (
          <div className="projects-slider-controls">
            <button className="slider-control-btn prev" onClick={handlePrev} aria-label="Previous Project">
              <Icon name="arrow" size={18} />
            </button>
            <div className="slider-pagination">
              {filteredProjects.map((_, i) => (
                <div key={i} className={`slider-dot ${i === activeIdx ? "active" : ""}`} onClick={() => setActiveIdx(i)} />
              ))}
            </div>
            <button className="slider-control-btn next" onClick={handleNext} aria-label="Next Project">
              <Icon name="arrow" size={18} />
            </button>
          </div>
        )}
      </div>

      <ProjectModal 
        project={selectedProjectModal} 
        onClose={() => setSelectedProjectModal(null)} 
      />
    </section>
  );
};

        body: JSON.stringify(form)
      });
      if (res.ok) {
        window.dispatchEvent(new Event("portfolio_new_lead"));
        showToast("Message sent — I'll get back to you soon!");
        setForm({ name: "", email: "", subject: "", message: "" });
      } else {
        showToast("Error sending message. Please try again.");
      }
    } catch(err) {
      console.error(err);
      showToast("Error sending message.");
    }
  };
  
  return (
    <section id="contact">
      <div className="container">
        <Reveal className="section-tag">
          <div className="eyebrow">Contact Me</div>
          <div className="section-heading">Get In Touch</div>
        </Reveal>
        <div className="contact-grid">
          <Reveal className="contact-info">
            <p>Have a project in mind or want to work together? Feel free to send me a message.</p>
            <a href={`mailto:${contact.email}`} className="contact-item"><div className="info-icon"><Icon name="mail" size={16} /></div><div className="info-value">{contact.email}</div></a>
            <a href={`tel:${contact.phone}`} className="contact-item"><div className="info-icon"><Icon name="phone" size={16} /></div><div className="info-value">{contact.phone}</div></a>
            <div className="contact-item"><div className="info-icon"><Icon name="pin" size={16} /></div><div className="info-value">{contact.location}</div></div>

            <div className="whatsapp-cta">
              <a href={contact.whatsappUrl} target="_blank" rel="noopener noreferrer" className="btn btn-whatsapp">
                <Icon name="whatsapp" size={17} /> Chat on WhatsApp
              </a>
            </div>
          </Reveal>

          <Reveal>
            <form className="contact-form" onSubmit={onSubmit}>
              <div className="form-row">
                <div className="field"><label>Your Name</label><input required value={form.name} onChange={onChange("name")} placeholder="Jane Doe" /></div>
                <div className="field"><label>Your Email</label><input required type="email" value={form.email} onChange={onChange("email")} placeholder="jane@email.com" /></div>
              </div>
              <div className="field"><label>Subject</label><input required value={form.subject} onChange={onChange("subject")} placeholder="Let's build something" /></div>
              <div className="field"><label>Your Message</label><textarea required value={form.message} onChange={onChange("message")} placeholder="Tell me about your project..." /></div>
              <button type="submit" className="btn btn-primary btn-block">Send Message <Icon name="arrow" size={15} /></button>
            </form>
          </Reveal>
        </div>
      </div>
    </section>
  );
};

/* ---------------- App Core ---------------- */
const SECTION_IDS = ["home", "about", "skills", "experience", "certificates", "projects", "contact"];

function App() {
  const [portfolioData, setPortfolioData] = useState(DEFAULT_PORTFOLIO_DATA);
  const [isAdminOpen, setIsAdminOpen] = useState(false);
  const [theme, setTheme] = useState("dark");
  const [active, setActive] = useState("home");
  const [toast, setToast] = useState({ show: false, msg: "" });

  useEffect(() => {
    // 1. Load cached data from localStorage immediately for instant 0ms load
    try {
      const cached = localStorage.getItem("portfolio_data");
      if (cached) {
        setPortfolioData(JSON.parse(cached));
      }
    } catch(e) {}

    const fetchPortfolioData = async () => {
      try {
        const res = await fetch(`${API_BASE}/api/portfolio-data`);
        if (res.ok) {
          const data = await res.json();
          setPortfolioData(data);
          try {
            localStorage.setItem("portfolio_data", JSON.stringify(data));
          } catch(e) {}
        }
      } catch(err) {
        console.error("Error loading portfolio data:", err);
      }
    };
    fetchPortfolioData();

    // 2. BroadcastChannel Listener (Instant sync across tabs in same browser)
    let bc;
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        bc = new BroadcastChannel('portfolio_sync');
        bc.onmessage = (e) => {
          if (e.data && e.data.type === 'PORTFOLIO_UPDATED' && e.data.data) {
            setPortfolioData(e.data.data);
            try {
              localStorage.setItem("portfolio_data", JSON.stringify(e.data.data));
            } catch(err) {}
            showToast("⚡ Portfolio updated live!");
          }
        };
      } catch(e) {}
    }

    // 3. Re-fetch when user switches back to tab
    const onFocus = () => fetchPortfolioData();
    window.addEventListener("focus", onFocus);

    // 4. Fallback Polling every 12s in case SSE is disconnected
    const pollInterval = setInterval(() => {
      fetchPortfolioData();
    }, 12000);

    // 5. Real-Time Live Sync EventSource Listener with auto-reconnect
    let eventSource;
    let reconnectTimer;

    const connectSSE = () => {
      try {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`${API_BASE}/api/events`);
        eventSource.onmessage = (e) => {
          try {
            const payload = JSON.parse(e.data);
            if (payload.type === 'PORTFOLIO_UPDATED' && payload.data) {
              setPortfolioData(payload.data);
              try {
                localStorage.setItem("portfolio_data", JSON.stringify(payload.data));
              } catch(err) {}
              showToast("⚡ Portfolio updated live!");
            }
          } catch(err) {
            console.error("SSE Message parse error:", err);
          }
        };

        eventSource.onerror = () => {
          if (eventSource) eventSource.close();
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connectSSE, 5000);
        };
      } catch(err) {
        console.error("EventSource error:", err);
      }
    };

    connectSSE();

    return () => {
      if (eventSource) eventSource.close();
      if (bc) bc.close();
      window.removeEventListener("focus", onFocus);
      clearInterval(pollInterval);
      clearTimeout(reconnectTimer);
    };
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    const anim = portfolioData.animationSettings || {
      intensity: "balanced",
      enableSplash: true,
      enableParallax: true,
      enableCursorGlow: true,
      reducedMotionRespect: true
    };
    const intensity = anim.intensity || "balanced";
    document.body.classList.remove("motion-minimal", "motion-balanced", "motion-premium", "reduced-motion", "motion-disabled-cursor");
    document.body.classList.add(`motion-${intensity}`);

    if (anim.enableCursorGlow === false) {
      document.body.classList.add("motion-disabled-cursor");
    }

    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (anim.reducedMotionRespect && mediaQuery.matches) {
      document.body.classList.add("reduced-motion");
    }
  }, [portfolioData.animationSettings]);

  const toggleTheme = () => setTheme(t => (t === "dark" ? "light" : "dark"));

  useEffect(() => {
    const onScroll = () => {
      let current = "home";
      for (const id of SECTION_IDS) {
        const el = document.getElementById(id);
        if (el && window.scrollY + 140 >= el.offsetTop) current = id;
      }
      setActive(current);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const showToast = (msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast({ show: false, msg: "" }), 3000);
  };

  return (
    <PortfolioContext.Provider value={{ data: portfolioData, setData: setPortfolioData, isAdminOpen, setIsAdminOpen }}>
      <SplashScreen />
      <CustomCursor />
      <Nav theme={theme} toggleTheme={toggleTheme} active={active} />
      <Hero theme={theme} />
      <About />
      <Skills />
      <Timeline />
      <Certificates />
      <Projects />
      <Contact showToast={showToast} />
      <footer>
        © 2026 {portfolioData.about ? portfolioData.about.name : "Mohamed Asik"}. All rights reserved.
      </footer>
      <div className={`toast ${toast.show ? "show" : ""}`}>
        <Icon name="dot" size={10} /> {toast.msg}
      </div>
      {isAdminOpen && <AdminPanel onClose={() => setIsAdminOpen(false)} showToast={showToast} />}
    </PortfolioContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
  <script>
    try {
      var source = document.getElementById("app-source").textContent;
      var compiled;
      try {
        compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
      } catch (e1) {
        console.warn("Babel transform with classic runtime failed, trying default react preset:", e1);
        compiled = Babel.transform(source, { presets: ["react"] }).code;
      }
      var runnable = document.createElement("script");
      runnable.textContent = compiled;
      document.body.appendChild(runnable);
    } catch (err) {
      console.error("Critical error compiling React application:", err);
      if (document.getElementById("root")) {
        document.getElementById("root").innerHTML = "<div style='color:#ef4444;padding:40px;text-align:center;font-family:sans-serif;'><h2>Application Compilation Error</h2><p style='color:#9aa3b8;'>" + err.message + "</p></div>";
      }
    }
  </script>
</body>

</html>
