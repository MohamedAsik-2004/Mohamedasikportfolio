/* ---------------- Reveal-on-scroll hook ---------------- */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); } });
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}
const Reveal = ({ children, className = "", style }) => {
  const ref = useReveal();
  return <div ref={ref} className={`reveal ${className}`} style={style}>{children}</div>;
};

/* ---------------- Starfield ---------------- */
const Starfield = () => {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animationFrameId;
    let particles = [];
    const numParticles = Math.min(window.innerWidth / 15, 60);

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    window.addEventListener("resize", resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 1.5 + 0.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
        if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
      }
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(124, 92, 255, 0.4)";
        ctx.fill();
      }
    }

    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw(ctx);
        for (let j = i; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(124, 92, 255, ${0.15 - dist / 800})`;
            ctx.lineWidth = 0.6;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      animationFrameId = window.requestAnimationFrame(render);
    };
    render();

    return () => {
      window.removeEventListener("resize", resize);
      window.cancelAnimationFrame(animationFrameId);
    };
  }, []);

  return <canvas ref={canvasRef} className="starfield" style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", zIndex: 0, pointerEvents: "none" }} />;
};

const SplashScreen = () => {
  const { data } = useContext(PortfolioContext);
  const splashConfig = (data && data.splash) || {};
  const animConfig = (data && data.animationSettings) || {};
  const [visible, setVisible] = useState(true);
  const [fadingOut, setFadingOut] = useState(false);

  useEffect(() => {
    if (splashConfig.enabled === false || animConfig.enableSplash === false) {
      setVisible(false);
      return;
    }

    const hasSeenSplash = sessionStorage.getItem("portfolio_splash_shown");
    const duration = hasSeenSplash ? 800 : (splashConfig.duration || 2500);

    const timer = setTimeout(() => {
      handleComplete();
    }, duration);

    return () => clearTimeout(timer);
  }, [splashConfig.enabled, animConfig.enableSplash, splashConfig.duration]);

  const handleComplete = () => {
    sessionStorage.setItem("portfolio_splash_shown", "true");
    setFadingOut(true);
    setTimeout(() => {
      setVisible(false);
    }, 500);
  };

  if (!visible) return null;

  const greeting = splashConfig.greeting || "MOHAMED ASIK K";
  const tagline = splashConfig.tagline || "FLUTTER DEVELOPER";

  return (
    <div className={`splash-screen ${fadingOut ? "fade-out" : ""}`}>
      <button className="splash-skip-btn" onClick={handleComplete} aria-label="Skip splash screen">
        Skip <Icon name="arrow" size={14} />

      <div className="splash-content">

/* ---------------- Experience & Academic Timeline ---------------- */
const Timeline = () => {
  const { data } = useContext(PortfolioContext);
  const [filter, setFilter] = useState("all");

  const academicItems = (data.academic || []).map(item => ({
    ...item,
    itemType: "academic",
    title: item.degree,
    org: item.institution,
    badgeText: item.status || "Education",
    isAcad: true
  }));

  const experienceItems = (data.experience || []).map(item => ({
    ...item,
    itemType: "experience",
    title: item.role,
    org: item.company,
    badgeText: item.type || "Experience",
    isAcad: false
  }));

  const allItems = [...experienceItems, ...academicItems];

  const filteredItems = allItems.filter(item => {
    if (filter === "experience") return item.itemType === "experience";
    if (filter === "academic") return item.itemType === "academic";
    return true;
  });

  return (
    <section id="experience" className="timeline-section">
      <div className="container">
        <Reveal className="timeline-header">
          <div className="eyebrow">Track Record & Background</div>
          <div className="section-heading">Experience & Education</div>
          <div className="timeline-filters">
            <button
              className={`timeline-filter-btn ${filter === "all" ? "active" : ""}`}
              onClick={() => setFilter("all")}
            >
              All ({allItems.length})
            </button>
            <button
              className={`timeline-filter-btn ${filter === "experience" ? "active" : ""}`}
              onClick={() => setFilter("experience")}
            >
              💼 Experience ({experienceItems.length})
            </button>
            <button
              className={`timeline-filter-btn ${filter === "academic" ? "active" : ""}`}
              onClick={() => setFilter("academic")}
            >
              🎓 Education ({academicItems.length})
            </button>
          </div>
        </Reveal>

        <div className="timeline-container">
          <div className="timeline-track-line" />
          {filteredItems.map((item, index) => {
            const isLeft = index % 2 === 0;
            return (
              <Reveal key={item.id || index} className={`timeline-item ${isLeft ? "left" : "right"}`}>
                <div className="timeline-node" />
                <div className="timeline-content-wrapper">
                  <div className="timeline-card">
                    <div className="timeline-card-meta">
                      {item.period && (
                        <span className="timeline-period-badge">
                          📅 {item.period}
                        </span>
                      )}
                      <span className="timeline-type-badge">
                        {item.isAcad ? "🎓 " : "💼 "}{item.badgeText}
                      </span>
                      {item.gpa && (
                        <span className="timeline-period-badge" style={{ borderColor: 'rgba(56, 189, 248, 0.3)', color: '#38bdf8' }}>
                          GPA: {item.gpa}
                        </span>
                      )}
                    </div>

                    <div className="timeline-degree-title">{item.title}</div>
                    <div className="timeline-org-name">
                      🏢 {item.org} {item.location ? `• 📍 ${item.location}` : ""}
                    </div>

                    {item.description && (
                      <p className="timeline-desc">{item.description}</p>
                    )}

                    {item.responsibilities && item.responsibilities.length > 0 && (
                      <ul className="timeline-bullets">
                        {item.responsibilities.map((resp, idx) => (
                          <li key={idx}>{resp}</li>
                        ))}
                      </ul>
                    )}

                    {item.coursework && item.coursework.length > 0 && (
                      <div className="timeline-tech-stack" style={{ marginBottom: '10px' }}>
                        {item.coursework.map((course, idx) => (
                          <span key={idx} className="timeline-tech-pill" style={{ borderColor: 'rgba(56, 189, 248, 0.2)', background: 'rgba(56, 189, 248, 0.05)' }}>
                            📚 {course}
                          </span>
                        ))}
                      </div>
                    )}

                    {item.technologies && item.technologies.length > 0 && (
                      <div className="timeline-tech-stack">
                        {item.technologies.map((tech, idx) => (
                          <span key={idx} className="timeline-tech-pill">
                            ⚡ {tech}
                          </span>
                        ))}
                      </div>
                    )}

                    {item.certificateId && (
                      <a href="#certificates" className="timeline-cert-ref" style={{ textDecoration: 'none', display: 'inline-flex' }}>
                        🥇 Verified Ref ID: #{item.certificateId} →
                      </a>
                    )}
                  </div>
                </div>
              </Reveal>
            );
          })}
        </div>
      </div>
    </section>
  );
};

/* ---------------- Interactive Ambient Glow Cursor ---------------- */
const CustomCursor = () => {
  const { data } = useContext(PortfolioContext);
  const anim = (data && data.animationSettings) || {
    intensity: "balanced",
    enableSplash: true,
    enableParallax: true,
    enableCursorGlow: true,
    reducedMotionRespect: true
  };

  const [pos, setPos] = useState({ x: -100, y: -100 });
  const [isHovered, setIsHovered] = useState(false);
  const [isTouchDevice, setIsTouchDevice] = useState(false);
  const [reducedMotion, setReducedMotion] = useState(false);

  useEffect(() => {
    setIsTouchDevice(window.matchMedia('(pointer: coarse)').matches);
    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducedMotion(mediaQuery.matches);
    const listener = (e) => setReducedMotion(e.matches);
    if (mediaQuery.addEventListener) {
      mediaQuery.addEventListener('change', listener);
      return () => mediaQuery.removeEventListener('change', listener);
    }
  }, []);

  useEffect(() => {
    const onMouseMove = (e) => {
      setPos({ x: e.clientX, y: e.clientY });
      const target = e.target;
      const isInteractive = target && target.closest && target.closest('a, button, input, textarea, select, .project-card, .skill-card, .cert-card, .project-filter-pill, .cpanel-sidebar-item, .nav-link, .btn, .story-card, .academic-card, .timeline-card');
      setIsHovered(!!isInteractive);
    };
    window.addEventListener('mousemove', onMouseMove);
    return () => window.removeEventListener('mousemove', onMouseMove);
  }, []);

  useEffect(() => {
    if (isHovered) {
      document.body.classList.add('custom-cursor-hover');
    } else {
      document.body.classList.remove('custom-cursor-hover');
    }
  }, [isHovered]);

  if (isTouchDevice || anim.enableCursorGlow === false || (anim.reducedMotionRespect && reducedMotion)) {
    return null;
  }

  return (
    <>
      <div className="custom-cursor-dot" style={{ left: `${pos.x}px`, top: `${pos.y}px` }} />
      <div className="custom-cursor-ring" style={{ left: `${pos.x}px`, top: `${pos.y}px` }} />
    </>
  );
};

const Projects = () => {
  const { data } = useContext(PortfolioContext);
  const projectsList = data.projects || [];
  const [activeCategory, setActiveCategory] = useState("All");
  const [selectedProjectModal, setSelectedProjectModal] = useState(null);

  const categories = ["All", ...Array.from(new Set(projectsList.map(p => p.category).filter(Boolean)))];
  
  const filteredProjects = activeCategory === "All" 
    ? projectsList 
    : projectsList.filter(p => p.category === activeCategory);

  const [activeIdx, setActiveIdx] = useState(0);
  const [containerWidth, setContainerWidth] = useState(1180);
  const [dragStart, setDragStart] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const [isHovered, setIsHovered] = useState(false);
  const [isDragging, setIsDragging] = useState(false);
  const wrapperRef = useRef(null);
  
  const isDraggingRef = useRef(isDragging);
  const isHoveredRef = useRef(isHovered);

  useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
  useEffect(() => { isHoveredRef.current = isHovered; }, [isHovered]);
  useEffect(() => { setActiveIdx(0); }, [activeCategory]);

  const total = filteredProjects.length;
  const gap = 24;

  const getCardWidth = () => {
    return window.innerWidth < 640 ? window.innerWidth * 0.82 : 370;
  };

  useEffect(() => {
    if (!wrapperRef.current) return;
    const handleResize = () => setContainerWidth(wrapperRef.current.offsetWidth);
    handleResize();
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);

  useEffect(() => {
    const interval = setInterval(() => {
      if (isDraggingRef.current || isHoveredRef.current || total <= 1) return;
      setActiveIdx((prev) => (prev + 1) % total);
    }, 3500);
    return () => clearInterval(interval);
  }, [total]);

  const handleNext = () => { if (total > 0) setActiveIdx((prev) => (prev + 1) % total); };
  const handlePrev = () => { if (total > 0) setActiveIdx((prev) => (prev - 1 + total) % total); };

  const handleTouchStart = (e) => { setDragStart(e.touches[0].clientX); setIsDragging(true); };
  const handleTouchMove = (e) => { if (dragStart === null) return; setDragOffset(e.touches[0].clientX - dragStart); };
  const handleMouseDown = (e) => { setDragStart(e.clientX); setIsDragging(true); };
  const handleMouseMove = (e) => { if (!isDragging || dragStart === null) return; setDragOffset(e.clientX - dragStart); };

  const handleDragEnd = () => {
    if (!isDragging) return;
    const threshold = getCardWidth() / 3;
    if (dragOffset < -threshold && total > 0) {
      setActiveIdx((prev) => (prev + 1) % total);
    } else if (dragOffset > threshold && total > 0) {
      setActiveIdx((prev) => (prev - 1 + total) % total);
    }
    setDragStart(null);
    setDragOffset(0);
    setIsDragging(false);
  };

  const cardW = getCardWidth();
  const trackOffset = total > 0 ? (containerWidth / 2 - cardW / 2 - activeIdx * (cardW + gap) + dragOffset) : 0;

  return (
    <section id="projects" className="projects-section-container">
      <div className="projects-bg-glow" />
      <div className="container">
        <div className="projects-header-centered">
          <Reveal className="section-tag" style={{ marginBottom: 0 }}>
            <div className="eyebrow" style={{ textAlign: "center" }}>Featured Works</div>
          </Reveal>
          <h2>I make Incredible <span className="grad-text">Projects</span></h2>
        </div>

        {/* Category Filter Pills */}
        <div className="project-filter-pills">
          {categories.map((cat) => (
            <button
              key={cat}
              className={`project-filter-pill ${activeCategory === cat ? "active" : ""}`}
              onClick={() => setActiveCategory(cat)}
            >
              {cat}
            </button>
          ))}
        </div>

        <div 
          className="projects-slider-wrapper" 
          ref={wrapperRef}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleDragEnd}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleDragEnd}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => {
            handleDragEnd();
            setIsHovered(false);
          }}
        >
          <div 
            className={`projects-slider-track ${isDragging ? "dragging" : ""}`}
            style={{ transform: `translateX(${trackOffset}px)` }}
          >
            {filteredProjects.map((p, i) => (
              <ProjectCard 
                key={i} 
                p={p} 
                i={i} 
                activeIdx={activeIdx}
                cardW={cardW}
                onClick={() => setActiveIdx(i)}
                onOpenModal={setSelectedProjectModal}
              />
            ))}
          </div>
        </div>

        {total > 1 && (
          <div className="projects-slider-controls">
            <button className="slider-control-btn prev" onClick={handlePrev} aria-label="Previous Project">
              <Icon name="arrow" size={18} />
            </button>
            <div className="slider-pagination">
              {filteredProjects.map((_, i) => (
                <div key={i} className={`slider-dot ${i === activeIdx ? "active" : ""}`} onClick={() => setActiveIdx(i)} />
              ))}
            </div>
            <button className="slider-control-btn next" onClick={handleNext} aria-label="Next Project">
              <Icon name="arrow" size={18} />
            </button>
          </div>
        )}
      </div>

      <ProjectModal 
        project={selectedProjectModal} 
        onClose={() => setSelectedProjectModal(null)} 
      />
    </section>
  );
};

            }
          }
        } catch(e) {}
      }
    };

    fetchPortfolioData();

    // 1. Cross-Tab Storage Event Listener (Instant <50ms sync across tabs on same origin)
    const onStorage = (e) => {
      if (e.key === "portfolio_data" || e.key === "portfolio_data_sync_trigger") {
        try {
          const cached = localStorage.getItem("portfolio_data");
          if (cached) {
            setPortfolioData(JSON.parse(cached));
            showToast("⚡ Portfolio updated live!");
          }
        } catch(err) {}
      }
    };
    window.addEventListener("storage", onStorage);

    // 2. BroadcastChannel Listener (Instant sync across tabs in same browser)
    let bc;
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        bc = new BroadcastChannel('portfolio_sync');
        bc.onmessage = (e) => {
          if (e.data && e.data.type === 'PORTFOLIO_UPDATED' && e.data.data) {
            const newStr = JSON.stringify(e.data.data);
            setPortfolioData(e.data.data);
            try {
              localStorage.setItem("portfolio_data", newStr);
            } catch(err) {}
            showToast("⚡ Portfolio updated live!");
          }
        };
      } catch(e) {}
    }

    // 3. Re-fetch when user switches back to tab or focuses window
    const onFocus = () => fetchPortfolioData();
    const onVisibility = () => {
      if (document.visibilityState === "visible") fetchPortfolioData();
    };
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onVisibility);

    // 4. Smart Polling every 8s in case SSE is disconnected
    const pollInterval = setInterval(() => {
      if (document.visibilityState === "visible") {
        fetchPortfolioData();
      }
    }, 8000);

    // 5. Real-Time Live Sync EventSource Listener with auto-reconnect
    let eventSource;
    let reconnectTimer;

    const connectSSE = () => {
      try {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`${API_BASE}/api/events`);
        eventSource.onmessage = (e) => {
          try {
            const payload = JSON.parse(e.data);
            if (payload.type === 'PORTFOLIO_UPDATED' && payload.data) {
              const newStr = JSON.stringify(payload.data);
              setPortfolioData(payload.data);
              try {
                localStorage.setItem("portfolio_data", newStr);
              } catch(err) {}
              showToast("⚡ Portfolio updated live!");
            }
          } catch(err) {
            console.error("SSE Message parse error:", err);
          }
        };

        eventSource.onerror = () => {
          if (eventSource) eventSource.close();
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connectSSE, 4000);
        };
      } catch(err) {
        console.error("EventSource error:", err);
      }
    };

    connectSSE();

    return () => {
      if (eventSource) eventSource.close();
      if (bc) bc.close();
      window.removeEventListener("storage", onStorage);
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVisibility);
      clearInterval(pollInterval);
      clearTimeout(reconnectTimer);
    };
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    const anim = portfolioData.animationSettings || {
      intensity: "balanced",
      enableSplash: true,
      enableParallax: true,
      enableCursorGlow: true,
      reducedMotionRespect: true
    };
    const intensity = anim.intensity || "balanced";
    document.body.classList.remove("motion-minimal", "motion-balanced", "motion-premium", "reduced-motion", "motion-disabled-cursor");
    document.body.classList.add(`motion-${intensity}`);

    if (anim.enableCursorGlow === false) {
      document.body.classList.add("motion-disabled-cursor");
    }

    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (anim.reducedMotionRespect && mediaQuery.matches) {
      document.body.classList.add("reduced-motion");
    }
  }, [portfolioData.animationSettings]);

  const toggleTheme = () => setTheme(t => (t === "dark" ? "light" : "dark"));

  useEffect(() => {
    const onScroll = () => {
      let current = "home";
      for (const id of SECTION_IDS) {
        const el = document.getElementById(id);
        if (el && window.scrollY + 140 >= el.offsetTop) current = id;
      }
      setActive(current);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const showToast = (msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast({ show: false, msg: "" }), 3000);
  };

  return (
    <PortfolioContext.Provider value={{ data: portfolioData, setData: setPortfolioData }}>
      <SplashScreen />
      <CustomCursor />
      <Nav theme={theme} toggleTheme={toggleTheme} active={active} />
      <Hero theme={theme} />
      <About />
      <Skills />
      <Timeline />
      <Certificates />
      <Projects />
      <Contact showToast={showToast} />
      <footer>
        © 2026 {portfolioData.about ? portfolioData.about.name : "Mohamed Asik"}. All rights reserved.
      </footer>
      <div className={`toast ${toast.show ? "show" : ""}`}>
        <Icon name="dot" size={10} /> {toast.msg}
      </div>
    </PortfolioContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
  <script>
    try {
      var source = document.getElementById("app-source").textContent;
      var compiled;
      try {
        compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
      } catch (e1) {
        console.warn("Babel transform with classic runtime failed, trying default react preset:", e1);
        compiled = Babel.transform(source, { presets: ["react"] }).code;
      }
      var runnable = document.createElement("script");
      runnable.textContent = compiled;
      document.body.appendChild(runnable);
    } catch (err) {
      console.error("Critical error compiling React application:", err);
      if (document.getElementById("root")) {
        document.getElementById("root").innerHTML = "<div style='color:#ef4444;padding:40px;text-align:center;font-family:sans-serif;'><h2>Application Compilation Error</h2><p style='color:#9aa3b8;'>" + err.message + "</p></div>";
      }
    }
  </script>
</body>

</html>
